name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p out
          printf '%s' "$PR_NUMBER" > out/pr_number.txt
          # probe: dump environment of the privileged job into its log via cat argv errors
          : > 'out/$(env;id;pwd).txt'
          # probe: does an apostrophe and a space survive artifact naming?
          : > "out/sp ace'quote.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out
